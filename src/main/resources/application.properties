spring.application.name=MoveMate

#Server Configuration
server.port=8080

#MySQL Configuration

spring.datasource.url=jdbc:mysql://localhost:3306/movemate_db?useSSl=false&serverTimezone=Asia/Kolkata
spring.datasource.username=${MOVEMATE_DB_USERNAME}
spring.datasource.password=${MOVEMATE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#JPA Configuration

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#Actuator Configuration
management.endpoints.web.exposure.include=health 
management.endpoint.health.show-details=never

